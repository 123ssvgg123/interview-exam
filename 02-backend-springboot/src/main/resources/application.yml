server:
  port: 8080

spring:
  application:
    name: springboot-helloworld-security

# 演示用的 JWT 配置。生产环境应通过环境变量注入，不要写死在仓库里。
app:
  jwt:
    # HS256 要求密钥至少 256 bit（32 字节）
    secret: "dsh-interview-demo-jwt-secret-key-please-change-me-2026"
    expiration-seconds: 3600

logging:
  level:
    root: INFO
    org.springframework.security: INFO
